<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kardenwort Desk</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/table.css">
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
    <div class="kw-lookup-container container">
        <!-- Workspace Tab Navigation -->
        <nav id="workspace-tab-bar" class="kw-tab-bar"><!-- WORKSPACE_TAB_BAR --></nav>

        <!-- Source Text Container -->
        <!-- SECTION_SOURCE_START -->
        <div class="section source-section" id="source-section">
            <div class="source-text" id="source-container"><!-- SOURCE_TEXT --></div>
        </div>
        <!-- SECTION_SOURCE_END -->

        <!-- Translation Container -->
        <!-- SECTION_TRANSLATION_START -->
        <div class="section translation-section" id="translation-section">
            <div class="translation-text" id="translation-container"><!-- TRANSLATION_TEXT --></div>
        </div>
        <!-- SECTION_TRANSLATION_END -->

        <!-- Lemma Extraction Table -->
        <!-- SECTION_LEMMAS_START -->
        <div class="section lemmas-section" id="lemmas-section">
            <table id="lemma-table">
                <thead>
                    <tr>
                        <th class="col-inflected">Inflected</th>
                        <th class="col-lemma">Lemma</th>
                        <th class="col-translation">Translation</th>
                        <th class="col-ipa">IPA</th>
                        <th class="col-morphology">Morphology</th>
                        <th class="col-pos">POS</th>
                        <th class="col-gender">Gender</th>
                    </tr>
                </thead>
                <tbody><!-- TABLE_ROWS --></tbody>
            </table>
        </div>
        <!-- SECTION_LEMMAS_END -->

        <!-- Action Toolbar Controls -->
        <div class="kw-action-toolbar" id="kw-action-toolbar">
            <button type="button" id="kw-btn-same-lemma" class="btn-toggle" title="Toggle Lemma-wide highlighting">Lemma</button>
            <button type="button" id="kw-btn-filter-selected" title="Toggle view: show only selected words">Selected</button>
            <button type="button" id="kw-btn-save" class="btn-primary" disabled title="Save changes (Ctrl+S)">Save (Ctrl+S)</button>
            <button type="button" id="kw-btn-update" title="Update / Re-render view (F5)">Update</button>
            <button type="button" id="kw-btn-retext" title="Re-translate text">Re-text</button>
            <button type="button" id="kw-btn-reword" title="Re-process selected words">Re-word</button>
            <button type="button" id="kw-btn-export" title="Send selected rows to Anki">Send to Anki</button>
            <button type="button" id="kw-btn-hand-tool" title="Toggle Text Selection / Hand Tool (Ctrl+Shift+A)">Hand Tool</button>
            <button type="button" id="kw-btn-delete" class="btn-danger" title="Delete selected rows (Delete)">Delete</button>
        </div>

        <!-- Language Verification Modal -->
        <div class="kw-modal-backdrop" id="kw-lang-modal" style="display: none;">
            <div class="kw-modal-box">
                <div class="kw-modal-header" id="kw-lang-modal-title">Language Verification</div>
                <div class="kw-modal-body" id="kw-lang-modal-body"></div>
                <div class="kw-modal-actions">
                    <button type="button" id="kw-btn-lang-yes" class="btn-primary">Yes</button>
                    <button type="button" id="kw-btn-lang-no">No</button>
                    <button type="button" id="kw-btn-lang-cancel">Cancel</button>
                </div>
            </div>
        </div>

        <!-- Toast Notifications -->
        <div class="kw-toast-container" id="kw-toast-container"></div>
    </div>

    <!-- State Hydration JSON Data Islands -->
    <script id="hl-mvp-script" type="text/plain" data-bookmarks="3" data-rainbow="1" data-enabled="1"></script>
    <script id="session-data" type="application/json">{}</script>
    <script id="token-map" type="application/json">[]</script>
    <!-- KARDENWORT_BOOTSTRAP -->
    <script id="kardenwort-bootstrap" type="application/json">{}</script>
    <script id="ui-config" type="application/json">{}</script>
    <script id="config-script">
    window.__CONFIG__ = {};
    </script>
    <script id="sentence-cards" type="application/json">
[]
</script>
    <script id="delivery-mode" type="text/plain">container</script>
    <script id="web-tab-mode" type="text/plain">tabs</script>
    <script id="tab-bar-position" type="text/plain">top</script>
    <script id="mismatch-info" type="application/json">{}</script>
    <script id="text-mode" type="text/plain">single</script>
    <script id="tsv-path" type="text/plain"></script>
    <script id="llm-filled" type="text/plain">false</script>
    <script id="session-zid" type="text/plain"></script>
    <script id="session-lang" type="text/plain">de</script>
    <script id="session-target-lang" type="text/plain">ru</script>
    <script id="display-mode" type="text/plain">monolithic</script>
    <script id="auto-inject-updates" type="text/plain">true</script>
    <script id="run-enrichment" type="text/plain">manual</script>
    <script id="worker-launched" type="text/plain">false</script>
    <script id="text-base-provider" type="text/plain">google</script>
    <script id="lemma-base-provider" type="text/plain">google</script>
    <script id="sentence-provenance" type="text/plain"></script>
    <script src="/js/types.js"></script>
    <script src="/js/state/store.js"></script>
    <script src="/js/components/SourceViewer.js"></script>
    <script src="/js/components/TranslationView.js"></script>
    <script src="/js/components/LemmaTable.js"></script>
    <script src="/js/components/WorkspaceTabs.js"></script>
    <script src="/js/services/sse.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
